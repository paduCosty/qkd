<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @keyframes qwanAnimation {
            0% { background-color: #ffcccb; }
            50% { background-color: #add8e6; }
            100% { background-color: #ffcccb; }
        }

        .animated-background {
            animation: qwanAnimation 10s infinite;
        }

        .fight-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .lion, .dragon {
            position: absolute;
            width: 100px;
            height: 100px;
            animation-duration: 5s;
            animation-iteration-count: infinite;
        }

        .lion {
            top: 20%;
            left: 30%;
            animation-name: lion-fight;
        }

        .dragon {
            top: 40%;
            right: 30%;
            animation-name: dragon-fight;
        }

        @keyframes lion-fight {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(200px); }
        }

        @keyframes dragon-fight {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-200px); }
        }
    </style>
</head>
<body>
    <div class="fight-container animated-background">
        <svg class="lion" viewBox="0 0 24 24">
            <path d="M12,2L2,22h20L12,2z"/>
        </svg>
        <svg class="dragon" viewBox="0 0 24 24">
            <path d="M12,2L2,22h20L12,2z"/>
        </svg>
        <div class="container">
            <h2>Login</h2>
            <form action="/login" method="post">
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username"><br><br>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password"><br><br>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
