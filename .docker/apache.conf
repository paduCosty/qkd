<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Override Apache's built-in /icons/ alias (from mod_autoindex)
    Alias /pwa-icons/ /var/www/html/public/pwa-icons/
    <Directory /var/www/html/public/pwa-icons>
        Require all granted
    </Directory>

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
